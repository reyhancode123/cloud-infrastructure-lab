services:
  app:
    build:
      context: ./docker/app
    container_name: cloud-lab-app
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - cloud-lab-network
    mem_limit: 128m
    cpus: 0.5

  nginx:
    image: nginx:alpine
    container_name: cloud-lab-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cloud-lab-network
    mem_limit: 64m
    cpus: 0.5

networks:
  cloud-lab-network:
    driver: bridge
